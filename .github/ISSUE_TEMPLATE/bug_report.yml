name: Bug report
description: Something in Immaterial Storage does not work the way it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A good report is one we can reproduce: versions, steps, and a log get it fixed fastest.

        **Is it a Storage Drawers bug?** If it also happens with Storage Drawers' own drawers and without this mod, please report it [to Storage Drawers](https://github.com/jaquadro/StorageDrawers/issues) instead.

        **Do you use Functional Storage?** That is the sibling mod, [Immaterial Drawers](https://github.com/DrimoZ/ImmaterialDrawers/issues), with its own tracker.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see instead.
      placeholder: A fully charged Energy Drawer shows 0 FE after I reload the world.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem, starting from a new world if you can.
      placeholder: |
        1. Place an Energy Drawer in a Storage Drawers wall
        2. Charge it with ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: drawer
    attributes:
      label: Which drawer?
      options:
        - Energy Drawer
        - Fluid Drawer
        - Chemical Drawer
        - Source Drawer
        - More than one
        - Not a specific drawer
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Immaterial Storage version
      description: From the mods list, or the jar name.
      placeholder: 0.1.0+1.21.1
    validations:
      required: true

  - type: input
    id: sd-version
    attributes:
      label: Storage Drawers version
      placeholder: 1.21.1-13.11.4
    validations:
      required: true

  - type: input
    id: neoforge-version
    attributes:
      label: NeoForge version
      placeholder: 21.1.248
    validations:
      required: true

  - type: dropdown
    id: side
    attributes:
      label: Where does it happen?
      options:
        - Singleplayer
        - Multiplayer (dedicated server)
        - Multiplayer (LAN / hosted from the client)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: other-mods
    attributes:
      label: Other relevant mods
      description: Especially the mod whose cables, pipes, machines or generators are involved (Mekanism, Ars Nouveau, Powah, Thermal...), and any modpack name and version.
      placeholder: Mekanism 10.7.19, Ars Nouveau 5.13, All The Mods 10 v1.2

  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: |
        Upload `logs/latest.log`, or the file from `crash-reports/`, to [mclo.gs](https://mclo.gs) or a Gist and paste the link here.
        Please do not paste whole logs into the issue.
      placeholder: https://mclo.gs/...

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I am using the latest release of Immaterial Storage for my Minecraft version.
          required: false
