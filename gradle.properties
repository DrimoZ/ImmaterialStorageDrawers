org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Same stack as the sibling mod (Immaterial Drawers), already proven on 1.21.1.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
# Bounded above on purpose: an open range accepts the next breaking NeoForge.
neo_version_range=[21.1,21.2)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

mod_id=immaterialstorage_sd
mod_name=Immaterial Storage
mod_license=MIT (code) / All Rights Reserved (assets)
mod_version=0.0.1
mod_group_id=dev.drimoz.immaterialstorage
mod_authors=DrimoZ
mod_description=Storage Drawers for what isn't an item: Forge Energy, fluids, Mekanism chemicals and Ars Nouveau Source.

# Storage Drawers, the mod we extend. 13.11.4 is both the newest 1.21.1 release and the HEAD of the
# branch read (SPIKE.md) - the branch's own mod_version=13.2.0 is stale, do not trust it.
# Pinned by Modrinth version id, not number: the NeoForge, Forge and Fabric jars all share the
# number 1.21.1-13.11.4, and the number resolved to the Fabric jar (intermediary names, nothing
# compiles). px0CCB06 = "Storage Drawers-1.21.1-neoforge-13.11.4".
storagedrawers_version=px0CCB06

# Probe mods, optional: compiled against for compat/jade and compat/top, never required, never
# bundled. Also on the dev runtime so the probes can be looked at. Same versions as Immaterial Drawers.
jade_version=15.10.6+neoforge
top_version=1.21_neo-12.0.8
# Optional: the Chemical Drawers. 10.7 is where gases, infusion types, pigments and slurries became
# one Chemical API, which is what this mod is compiled against. Same release as Immaterial Drawers.
mekanism_version=10.7.19.85
# Optional: the Source Drawer. Modrinth version ids, as Immaterial Drawers pins them; Curios and
# GeckoLib are what Ars Nouveau needs at run time.
ars_nouveau_version=1VWyxABY
curios_version=yohfFbgD
geckolib_version=Grwn5rUB

# Showcase run only (./gradlew runClient -Pshowcase): Sodium + Iris so a shader pack can light the
# store screenshots. Iris 1.8.12 pins Sodium 0.6.13 - move them together or not at all.
sodium_version=mc1.21.1-0.6.13-neoforge
iris_version=1.8.12+1.21.1-neoforge
