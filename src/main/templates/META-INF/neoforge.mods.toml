modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/DrimoZ/ImmaterialStorageDrawers/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The mod we extend. Floor = the release the contract was read from (SPIKE.md). No upper
# bound yet: the contract is four API interfaces and one capability name, and the game tests are
# what catch a break - revisit if a release does break it.
[[dependencies.${mod_id}]]
modId = "storagedrawers"
type = "required"
versionRange = "[13.11.4,)"
ordering = "AFTER"
side = "BOTH"

# Optional, for the Chemical Drawers: without it they are never registered and no class touching its
# API is loaded. Declared so a release before the unified Chemical API (10.7) is a loader message,
# not a crash, and AFTER so its chemical registry exists before our blocks. No upper bound: on an
# optional dependency, one would refuse to launch the whole pack the day Mekanism ships a 10.8.
[[dependencies.${mod_id}]]
modId = "mekanism"
type = "optional"
versionRange = "[10.7,)"
ordering = "AFTER"
side = "BOTH"

# Optional, for the Source Drawer, on the same terms as Mekanism above. 5.13 is the release the
# Source API was read from (ISourceCap, SourceManager).
[[dependencies.${mod_id}]]
modId = "ars_nouveau"
type = "optional"
versionRange = "[5.13,)"
ordering = "AFTER"
side = "BOTH"
