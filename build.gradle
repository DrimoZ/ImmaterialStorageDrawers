plugins {
    id 'java-library'
    // Same ModDevGradle as the sibling mod: one known-good toolchain for both.
    id 'net.neoforged.moddev' version '2.0.75'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // `-PquickPlay="World Name"` opens straight into a saved world, for staging screenshots.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
            if (project.hasProperty('showcase')) {
                programArguments.addAll '--width', '1920', '--height', '1080'
            }
        }
        // A real dedicated server, for checking the mod outside a single-player world (client
        // classes kept off the server, real network sync). Connect a client run to localhost.
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        // Runs every @GameTest headlessly and exits non-zero if any fails. The spike's acceptance
        // criterion (SPIKE.md), kept afterwards as a regression check against new
        // Storage Drawers releases.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            gameDirectory = project.file('run-gametest')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        // Storage Drawers publishes no API jar and no public maven; Modrinth's maven serves the
        // released jar (pinned by Modrinth version id, see gradle.properties).
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Hard dependency, never bundled: it is the mod we extend.
    implementation "maven.modrinth:storagedrawers:${storagedrawers_version}"

    // Optional: the plugin classes are only loaded when the probe mod is (Jade by its own annotation
    // scan, The One Probe behind a ModList check), so neither is required to play.
    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"
    compileOnly "maven.modrinth:the-one-probe:${top_version}"
    // Left out of the showcase run: its box is drawn over the screenshots even with the HUD hidden.
    if (!project.hasProperty('showcase')) {
        runtimeOnly "maven.modrinth:the-one-probe:${top_version}"
    }

    // Mekanism is optional: the Chemical Drawers exist only when it is installed. compileOnly, never
    // bundled; every class that touches its API is reached through Mods.mekanism(). runtimeOnly too,
    // so the game tests see the chemical drawers; `-PnoMekanism` drops it, to exercise the absent path.
    compileOnly "maven.modrinth:mekanism:${mekanism_version}"
    if (!project.hasProperty("noMekanism")) {
        runtimeOnly "maven.modrinth:mekanism:${mekanism_version}"
    }

    // Ars Nouveau, same arrangement, for the Source Drawer: behind Mods.arsNouveau(). `-PnoArs` drops
    // it (and the two mods it needs) from the run, to exercise the absent path.
    compileOnly "maven.modrinth:ars-nouveau:${ars_nouveau_version}"
    if (!project.hasProperty("noArs")) {
        runtimeOnly "maven.modrinth:ars-nouveau:${ars_nouveau_version}"
        runtimeOnly "maven.modrinth:curios:${curios_version}"
        runtimeOnly "maven.modrinth:geckolib:${geckolib_version}"
    }

    // Scenery for store screenshots, only when asked for: `runClient -Pshowcase`. Sodium and Iris
    // are client-only and heavy, so the everyday client and the game test server never load them.
    if (project.hasProperty('showcase')) {
        runtimeOnly "maven.modrinth:mekanism-generators:${mekanism_version}"
        runtimeOnly "maven.modrinth:sodium:${sodium_version}"
        runtimeOnly "maven.modrinth:iris:${iris_version}"
    }
}

// Expand gradle.properties into neoforge.mods.toml so versions live in one place.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from(file('LICENSE')) { into 'META-INF' }
    from(file('LICENSE-ASSETS')) { into 'META-INF' }
    from(file('NOTICE')) { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xlint:deprecation'
}
